name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Resolve dependencies
        run: swift package resolve
      - name: Lint Swift sources
        run: xcrun swift-format lint --recursive --strict Sources Tests Apps/SAFA/Targets Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
      - name: Release build
        run: swift build -c release
      - name: Assemble native runtime targets without signing secrets
        run: >-
          xcodebuild -quiet -project Apps/SAFA/SAFA.xcodeproj -scheme "SAFA Runtime"
          -configuration Debug CODE_SIGNING_ALLOWED=NO build
